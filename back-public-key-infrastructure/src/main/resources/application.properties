spring.application.name=public-key-infrastructure
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=siit.i.bezbednost@gmail.com
spring.mail.password=kndv gspc gmik fvla
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=http://localhost:8080/api/auth

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:pki_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# Security Configuration
# Master key is now stored in database and encrypted with server key
# Server key can be provided via file, environment variable, or fallback

# Server key configuration (choose one method)
# Method 1: File system (recommended for production)
app.security.server-key.file=/etc/pki/server-key.bin

# Method 2: Environment variable (recommended for containers)
app.security.server-key.env=PKI_SERVER_KEY

# Method 3: Fallback (development only - NOT for production)
app.security.server-key.fallback=uWYpoWXpPKHm5yF5LCLmfYcL8i3mzPeekvlXUskkcvY=

# Key rotation configuration
app.security.key-rotation.master-key.cron=0 0 2 * * ?
app.security.key-rotation.user-keys.cron=0 0 3 * * SUN

# Cache configuration for keys
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

# CRL Configuration
app.server.base-url=https://localhost:8443
app.crl.endpoint=/api/crl

# HTTPS/SSL Configuration
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=privatekey

